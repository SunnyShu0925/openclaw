name: Windows Native Proof (PR #172869)

on:
  workflow_dispatch:
    inputs:
      pr_head:
        description: "PR head SHA or branch name"
        required: false
        default: "fix/cron-cwd-trim-201"

jobs:
  windows-proof:
    runs-on: windows-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.pr_head || github.ref_name }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build cliStartup
        continue-on-error: true

      - name: Verify CLI built
        run: node openclaw.mjs --version
        shell: pwsh

      - name: Run Windows native proof
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $output = & pwsh -File .github/workflows/windows-runner-proof.ps1 2>&1
          $output | Out-File -FilePath windows-proof-output.txt -Encoding UTF8
          Write-Host $output
          # Check for PASS in summary
          if ($output -match "Case 1.*PASS" -and $output -match "Case 2.*PASS") {
            Write-Host "::notice::Both Windows proof cases PASSED"
          } else {
            Write-Host "::warning::One or more proof cases did not PASS"
          }

      - name: Upload proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-proof-output
          path: |
            windows-proof-output.txt
            C:\oc-winproof\gw-stdout.log
            C:\oc-winproof\gw-stderr.log
          retention-days: 30
